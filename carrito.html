<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Edén - Carrito</title>
  <link rel="stylesheet" href="../CSS/comun.css">
  <link rel="stylesheet" href="../CSS/carrito.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="container header-container">
      <a href="Menu.html" class="logo">
        <i class="fa-solid fa-utensils logo-icon"></i>
        <div class="logo-text">
          <h1>EL EDÉN</h1>
          <span>SABORES DE PACARÁN Y CAÑETE</span>
        </div>
      </a>
    </div>
  </header>

  <main>

    <h2>Detalles de tu pedido</h2>

    <div class="carrito-contenedor">

      <!-- Contenedor dinámico cargado por carrito.js -->
      <section id="carrito-lista">
      </section>

      <aside id="carrito-resumen">
        <h3>Resumen del pedido</h3>

        <label for="carrito-cupon">Cupón de descuento</label>
        <input type="text" id="carrito-cupon" placeholder="Ingresa tu cupón">
        <button class="carrito-btn carrito-aplicar">Aplicar</button>

        <div class="carrito-linea">
          <span>Subtotal</span>
          <span>S/ 0.00</span>
        </div>
        <div class="carrito-linea">
          <span>Envío (Pacarán y alrededores)</span>
          <span>S/ 5.00</span>
        </div>
        <div class="carrito-linea">
          <span>Impuestos (IGV 18%)</span>
          <span>S/ 0.00</span>
        </div>

        <div id="carrito-total">
          <span>Total a pagar</span>
          <span class="carrito-monto">S/ 0.00</span>
        </div>
      </aside>

    </div>

    <nav id="carrito-acciones">
      <a href="Menu.html" class="carrito-btn carrito-secundario"><i class="bi bi-arrow-left"></i> Continuar comprando</a>
      <a href="checkout.html" class="carrito-btn carrito-principal">Procesar pedido <i class="bi bi-arrow-right"></i> </a>
    </nav>

  </main>

  <footer>
    <p>© 2026 Restaurante El Edén · Pacarán, Cañete</p>
  </footer>
  <script src="JS/carrito.js"></script>
</body>
</html>
