<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - El Edén</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="contenedor-principal">
        
        <section class="panel-izquierdo">
            <div class="mensaje-banner">
                <h1>El sabor tradicional de Pacarán, directo a tu mesa</h1>
            </div>
        </section>

        <section class="panel-derecho">
            <header class="opciones-superiores">
                <span>[ ES / EN ]</span>
                <span>[ Ayuda <i class="fa-regular fa-circle-question"></i> ]</span>
            </header>

            <div class="caja-formulario">
                <div class="pestanas">
                    <button id="tab-login" class="tab activa">Iniciar Sesión</button>
                    <button id="tab-registro" class="tab">Registrarse</button>
                </div>
                

                <form id="form-login">
                    <div class="grupo-input">
                        <i class="fa-regular fa-user icono-input"></i>
                        <input type="email" placeholder="Correo electrónico o número de teléfono" required>
                    </div>

                    <div class="grupo-input input-password-container">
                        <i class="fa-solid fa-lock icono-input"></i>
                        <input type="password" id="input-password-login" placeholder="Contraseña" required>

                        <button type="button" id="btn-ver-pass-login" class="btn-ojo">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>

                    <div class="opciones-password">
                        <a href="#" class="link-olvido">Olvidé mi contraseña</a>
                    </div>

                    <button type="submit" class="btn-principal">[ INICIAR SESIÓN ]</button>
                </form>


                <form id="form-registro" class="oculto">
                    <div class="grupo-input">
                        <i class="fa-regular fa-address-card icono-input"></i>
                        <input type="text" placeholder="Nombre completo" required>
                    </div>

                    <div class="grupo-input">
                        <i class="fa-regular fa-envelope icono-input"></i>
                        <input type="email" placeholder="Correo electrónico" required>
                    </div>

                    <div class="grupo-input input-password-container">
                        <i class="fa-solid fa-lock icono-input"></i>
                        <input type="password" id="input-password-registro" placeholder="Crear contraseña" required>
                        <button type="button" id="btn-ver-pass-registro" class="btn-ojo">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn-principal">[ CREAR CUENTA ]</button>
                </form>

                <div class="divisor">
                    <span>O continúa con</span>
                </div>
            
                <button class="btn-google">
                    <i class="fa-brands fa-google"></i> [ Continuar con Google ]
                </button>

                <div class="acceso-admin">
                    <a href="#" class="link-admin"><i class="fa-solid fa-user-tie"></i> [ Acceso Administrador ]</a>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
